[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwalk"
version = "0.1.0"
description = "Nightly customer-zero interactive dogfooding runner with browser pool CDP telemetry, multimodal Vision QA, and deduplicated ticket filing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nightwalk = "nightwalk.cli:main"

[tool.setuptools.packages.find]
include = ["nightwalk*"]
